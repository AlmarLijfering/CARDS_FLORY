<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      (function () {
        var path = window.location.pathname || '/';
        var query = window.location.search || '';
        if (path === '/session' || path.indexOf('/session/') === 0) {
          var sessionRoute = path === '/session' ? '/' : path.slice('/session'.length);
          window.location.replace('/session/#' + sessionRoute + query);
          return;
        }
        var hashPath = path === '/' ? '' : '#' + path + query;
        window.location.replace('/' + hashPath);
      })();
    </script>
  </head>
  <body></body>
 </html>
