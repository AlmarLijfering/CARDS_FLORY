{% extends "layout.html" %}

{% block title %}Overview Cards{% endblock %}

{% block content %}
<div class="container no-hover">
  <div class="row mb-3">
    <div class="col-12 text-center">
      <h5 data-i18n="overviewHeading">Overview of Selected Cards</h5>
      <button id="back-btn" class="btn btn-secondary" data-i18n="newSelection">New Selection</button>
      <button id="print-btn" class="btn btn-primary" data-i18n="printPdf">Print to PDF</button>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="card-wrapper" id="card-container">
        {% for image in images %}
          <div class="card">
            <img
              src="{{ url_for('static', filename=image.large) }}"
              class="large"
              alt="Selected Image {{ image.id }}"
              crossorigin="anonymous">
          </div>
        {% endfor %}
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>

<script>
  let currentLanguage = {{ current_language|tojson }};
  const translations = {
    en: {
      overviewHeading: 'Overview of Selected Cards', newSelection: 'New Selection', printPdf: 'Print to PDF',
      noCardsSelected: 'No cards selected.', pageLabel: 'Page', pdfName: 'selected_cards.pdf'
    },
    nl: {
      overviewHeading: 'Overzicht van geselecteerde kaarten', newSelection: 'Nieuwe selectie', printPdf: 'Afdrukken naar pdf',
      noCardsSelected: 'Geen kaarten geselecteerd.', pageLabel: 'Pagina', pdfName: 'geselecteerde_kaarten.pdf'
    },
    ro: {
      overviewHeading: 'Prezentare generală a cărților selectate', newSelection: 'Selecție nouă', printPdf: 'Tipărește în PDF',
      noCardsSelected: 'Nu există cărți selectate.', pageLabel: 'Pagina', pdfName: 'carti_selectate.pdf'
    }
  };

  function t(key) {
    const dict = translations[currentLanguage] || translations.en;
    return dict[key] || translations.en[key] || key;
  }

  function applyLanguage(lang) {
    currentLanguage = translations[lang] ? lang : 'en';
    const dict = translations[currentLanguage] || translations.en;
    document.querySelectorAll('[data-i18n]').forEach(node => {
      const key = node.dataset.i18n;
      if (dict[key]) node.textContent = dict[key];
    });
  }

  document.getElementById('back-btn').addEventListener('click', () => {
    window.location.href = "{{ url_for('select_cards') }}";
  });

  function loadImage(url) {
    return new Promise((resolve, reject) => {
      const im = new Image();
      im.crossOrigin = "anonymous";
      im.onload = () => resolve(im);
      im.onerror = reject;
      im.src = url;
    });
  }

  function imageToSquareDataURL(imageObj, sizePx = 1024, mode = "contain", background = "#FFFFFF") {
    const canvas = document.createElement('canvas');
    canvas.width = sizePx;
    canvas.height = sizePx;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = background;
    ctx.fillRect(0, 0, sizePx, sizePx);

    const iw = imageObj.naturalWidth || imageObj.width;
    const ih = imageObj.naturalHeight || imageObj.height;

    const scaleContain = Math.min(sizePx / iw, sizePx / ih);
    const scaleCover = Math.max(sizePx / iw, sizePx / ih);
    const scale = (mode === "cover") ? scaleCover : scaleContain;

    const dw = Math.round(iw * scale);
    const dh = Math.round(ih * scale);
    const dx = Math.round((sizePx - dw) / 2);
    const dy = Math.round((sizePx - dh) / 2);

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(imageObj, dx, dy, dw, dh);

    return canvas.toDataURL("image/png");
  }

  document.getElementById('print-btn').addEventListener('click', async () => {
    const { jsPDF } = window.jspdf;

    const doc = new jsPDF({ orientation: "p", unit: "mm", format: "a4" });

    const domImgs = Array.from(document.querySelectorAll('#card-container .card img'));
    const srcs = domImgs.map(i => i.currentSrc || i.src).filter(Boolean);

    if (srcs.length === 0) {
      alert(t('noCardsSelected'));
      return;
    }

    const cols = 2;
    const rows = 3;
    const perPage = cols * rows;

    const margin = 10;
    const gap = 6;
    const top = 18;

    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();

    const cellW = (pageW - margin * 2 - gap * (cols - 1)) / cols;
    const cellH = (pageH - top - margin - gap * (rows - 1)) / rows;
    const sideMm = Math.min(cellW, cellH);

    const drawHeader = (pageIndex) => {
      doc.setFontSize(14);
      doc.text(t('overviewHeading'), margin, 12);
      doc.setFontSize(10);
      doc.text(`${t('pageLabel')} ${pageIndex}`, pageW - margin, 12, { align: "right" });
    };

    const mode = "contain";
    const squarePx = 1024;
    const bg = "#FFFFFF";

    let pageIndex = 1;
    drawHeader(pageIndex);

    for (let i = 0; i < srcs.length; i++) {
      if (i > 0 && i % perPage === 0) {
        doc.addPage();
        pageIndex += 1;
        drawHeader(pageIndex);
      }

      const indexOnPage = i % perPage;
      const r = Math.floor(indexOnPage / cols);
      const c = indexOnPage % cols;

      const x = margin + c * (sideMm + gap);
      const y = top + r * (sideMm + gap);

      const imgObj = await loadImage(srcs[i]);
      const dataUrl = imageToSquareDataURL(imgObj, squarePx, mode, bg);
      doc.addImage(dataUrl, 'PNG', x, y, sideMm, sideMm);
    }

    doc.save(t('pdfName'));
  });

  applyLanguage(currentLanguage);
</script>
{% endblock %}
