{% extends "layout.html" %}

{% block title %}Overview Cards{% endblock %}

{% block content %}
<div class="container no-hover">
  <div class="row mb-4">
    <div class="col-12">
      <div class="landing-hero p-4">
        <div class="d-flex flex-column flex-lg-row justify-content-between align-items-start align-items-lg-center gap-3">
          <div>
            <span class="text-uppercase small fw-semibold text-muted">Review</span>
            <h5 class="mb-1" data-i18n="overviewHeading">Overview of Selected Cards</h5>
            <p class="text-muted mb-0" data-i18n="overviewHint">Confirm the order below before printing or sharing.</p>
          </div>
          <div class="d-flex flex-column flex-sm-row gap-2">
            <button id="back-btn" class="btn btn-outline-secondary" data-i18n="editSelection">Edit Selection</button>
            <button id="print-btn" class="btn btn-primary" data-i18n="printPdf">Print to PDF</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="card-wrapper" id="card-container">
        {% for image in images %}
          <div class="card overview-card">
            <span class="overview-order-chip" aria-label="Selection order {{ loop.index }}">{{ loop.index }}</span>
            <img
              src="{{ url_for('static', filename=image.large) }}"
              class="large"
              alt="Selected Image {{ image.id }}"
              crossorigin="anonymous">
            <div class="overview-card-meta">Card {{ image.id }}</div>
          </div>
        {% endfor %}
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
<script>
  window.overviewCardsConfig = {{ {
    'currentLanguage': current_language,
    'routes': {
      'selectCards': url_for('select_cards'),
    }
  } | tojson }};
</script>
<script src="{{ url_for('static', filename='JS/overview_cards.js') }}"></script>
{% endblock %}
