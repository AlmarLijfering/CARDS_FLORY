{% extends "layout.html" %}

{% block title %}
Select Cards
{% endblock %}

{% block content %}
<div class="container-fluid">
  <div class="row g-3 align-items-start">
    <div class="col-12 col-lg-5 order-1 order-lg-2 floating-right selection-panel">
      <div class="selection-header d-flex align-items-center justify-content-between">
        <div>
          <h5 class="mb-1">Your selection</h5>
          <p class="text-muted small mb-2">Tap to add, drag to reorder, and keep scrolling the grid.</p>
        </div>
        <span id="selection-count" class="badge rounded-pill text-bg-light border">0/6</span>
      </div>
      <div class="dropzone-wrapper rail">
        <div id="dropzone-1" class="dropzone empty" data-zone="1"></div>
        <div id="dropzone-2" class="dropzone empty" data-zone="2"></div>
        <div id="dropzone-3" class="dropzone empty" data-zone="3"></div>
        <div id="dropzone-4" class="dropzone empty" data-zone="4"></div>
        <div id="dropzone-5" class="dropzone empty" data-zone="5"></div>
        <div id="dropzone-6" class="dropzone empty" data-zone="6"></div>
      </div>
      <div class="d-flex flex-column flex-sm-row align-items-stretch align-items-sm-center gap-2 mt-3">
        <button id="finalize-btn" class="btn btn-primary finalize-btn flex-fill" disabled>Finalize Selection</button>
        <span class="text-muted small text-center d-none d-sm-inline">Up to 6 cards</span>
      </div>
    </div>
    <div class="col-12 col-lg-7 order-2 order-lg-1">
      <div id="left-container" class="container">
        <div class="d-flex align-items-center justify-content-between">
          <h5 class="mb-0">Available Images</h5>
          <small class="text-muted d-lg-none mobile-hint">Tap a card to add it above</small>
        </div>
        <div class="card-wrapper">
          {% for image in images %}
          <div id="slot-{{ image.id }}" class="placeholder empty">
            <div id="card-{{ image.id }}" class="card" draggable="true" data-id="{{ image.id }}"
              data-large="{{ url_for('static', filename=image.large) }}">
              <img src="{{ url_for('static', filename=image.small) }}" class="small" alt="Image {{ image.id }}">
            </div>
          </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const maxCards = 6;
  const finalizeBtn = document.getElementById('finalize-btn');
  const selectionCount = document.getElementById('selection-count');
  const dropzones = Array.from(document.querySelectorAll('.dropzone'));
  const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  let draggedElement = null;
  let draggedFromPlaceholder = false;
  let placementSucceeded = false;
  let selectedCardsCount = 0;

  function getFirstEmptyDropzone() {
    return dropzones.find(zone => zone.classList.contains('empty'));
  }

  function updateFinalizeButton() {
    finalizeBtn.disabled = selectedCardsCount === 0;
    finalizeBtn.textContent = selectedCardsCount > 0
      ? `Finalize Selection (${selectedCardsCount}/${maxCards})`
      : 'Finalize Selection';
    updateSelectionCount();
  }

  function updateSelectionCount() {
    if (selectionCount) {
      selectionCount.textContent = `${selectedCardsCount}/${maxCards}`;
      selectionCount.classList.toggle('text-bg-primary', selectedCardsCount > 0);
      selectionCount.classList.toggle('text-bg-light', selectedCardsCount === 0);
    }
  }

  function placeCardInDropzone(cardElement, dropzone) {
    const originDropzone = cardElement.closest('.dropzone');
    const movingExistingCard = Boolean(originDropzone);

    if (!dropzone || (!movingExistingCard && selectedCardsCount >= maxCards)) {
      return false;
    }

    if (originDropzone && originDropzone !== dropzone) {
      originDropzone.classList.add('empty');
      originDropzone.innerHTML = '';
      selectedCardsCount = Math.max(selectedCardsCount - 1, 0);
    }

    if (!dropzone.classList.contains('empty')) {
      if (originDropzone) {
        originDropzone.appendChild(cardElement);
        originDropzone.classList.remove('empty');
        selectedCardsCount = Math.min(selectedCardsCount + 1, maxCards);
        updateFinalizeButton();
      }
      return false;
    }

    dropzone.classList.remove('empty');
    dropzone.appendChild(createCard(cardElement, dropzone));

    const slot = document.getElementById(`slot-${cardElement.dataset.id}`);
    if (slot) {
      slot.classList.add('empty', 'selected');
      if (!movingExistingCard) {
        cardElement.style.visibility = 'hidden';
      }
    }

    selectedCardsCount++;
    updateFinalizeButton();
    return true;
  }

  function handleCardSelection(cardElement) {
    const isCardAvailable = !!cardElement.closest('.placeholder');
    if (!isCardAvailable) return;

    const targetDropzone = getFirstEmptyDropzone();
    if (targetDropzone && placeCardInDropzone(cardElement, targetDropzone)) {
      placementSucceeded = true;
    }
  }

  function createCard(element, dropzone) {
    const card = document.createElement('div');
    card.className = 'card';
    card.draggable = true;
    card.dataset.id = element.dataset.id;

    const img = document.createElement('img');
    img.src = element.dataset.large;
    img.classList.add('large');
    card.appendChild(img);

    const btn = document.createElement('button');
    btn.className = 'remove-btn';
    btn.innerHTML = '&times;';
    btn.onclick = () => {
      const slot = document.getElementById('slot-' + element.dataset.id);
      if (slot) {
        slot.classList.remove('empty', 'selected');
        slot.appendChild(element);
        element.style.visibility = 'visible';
      }
      dropzone.classList.add('empty');
      card.remove();
      selectedCardsCount = Math.max(selectedCardsCount - 1, 0);
      updateFinalizeButton();
    };
    card.appendChild(btn);

    card.addEventListener('dragstart', handleDragStart);
    card.addEventListener('dragend', handleDragEnd);

    return card;
  }

  function handleDragStart(e) {
    draggedElement = e.target.closest('.card');
    if (!draggedElement) return;

    draggedFromPlaceholder = !!draggedElement.closest('.placeholder');
    placementSucceeded = false;

    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = 'move';
    }

    draggedElement.classList.add('dragging');
    setTimeout(() => {
      draggedElement.style.visibility = 'hidden';
      const parent = draggedElement.closest('.placeholder');
      if (parent) {
        parent.classList.add('empty');
      }
    }, 0);
  }

  function handleDragEnd() {
    if (!draggedElement) return;

    const shouldHide = draggedFromPlaceholder && placementSucceeded;
    draggedElement.style.visibility = shouldHide ? 'hidden' : 'visible';
    draggedElement.classList.remove('dragging');

    const parent = draggedElement.closest('.placeholder');
    if (parent) {
      parent.classList.toggle('empty', shouldHide);
    }

    draggedElement = null;
    draggedFromPlaceholder = false;
    placementSucceeded = false;
  }

  document.querySelectorAll('#left-container .card').forEach(card => {
    card.addEventListener('dragstart', handleDragStart);
    card.addEventListener('dragend', handleDragEnd);

    if (isTouchDevice) {
      card.addEventListener('click', () => handleCardSelection(card));
    }
  });

  dropzones.forEach(dropzone => {
    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (e.dataTransfer) {
        e.dataTransfer.dropEffect = 'move';
      }
    });

    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      if (draggedElement) {
        placementSucceeded = placeCardInDropzone(draggedElement, dropzone);
        draggedElement = null;
      }
    });

    if (isTouchDevice) {
      dropzone.addEventListener('click', () => {
        if (draggedElement) {
          placementSucceeded = placeCardInDropzone(draggedElement, dropzone);
          draggedElement = null;
        }
      });
    }
  });

  finalizeBtn.addEventListener('click', () => {
    const selectedCards = [];
    dropzones.forEach(dropzone => {
      if (!dropzone.classList.contains('empty')) {
        const card = dropzone.querySelector('.card');
        if (card) {
          selectedCards.push(card.dataset.id);
        }
      }
    });

    fetch('/finalize', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ selectedCards }),
    })
      .then(async response => {
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.message || 'Unable to save your selection.');
        }
        return data;
      })
      .then(data => {
        if (data.status === 'success') {
          window.location.href = '/overview_cards';
        }
      })
      .catch(error => {
        alert(error.message || 'Unable to save your selection. Please try again.');
      });
  });

  updateFinalizeButton();
</script>
{% endblock %}
